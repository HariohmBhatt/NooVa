<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111a18" />
    <title>NOVA — device status</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="preview" aria-label="Nova device preview">
      <section class="device" aria-label="Nova touch terminal">
        <div class="camera" aria-hidden="true"></div>
        <div class="screen">
          <header class="topbar">
            <div class="wordmark">
              <span class="wordmark-mark" aria-hidden="true"></span>
              <span>NOVA</span>
            </div>
            <span class="topbar-label">DEVICE STATUS</span>
          </header>

          <div class="screen-content">
            <section class="telemetry-card" aria-labelledby="telemetry-heading">
              <div class="section-heading">
                <h2 id="telemetry-heading">Utilisation</h2>
                <span>LAST 10 MIN</span>
              </div>
              <svg
                class="telemetry-chart"
                id="utilisation-chart"
                role="img"
                aria-label="CPU and GPU utilisation over the last ten minutes"
              >
                <line class="chart-grid" id="chart-grid-0"></line>
                <line class="chart-grid" id="chart-grid-1"></line>
                <line class="chart-grid" id="chart-grid-2"></line>
                <polyline class="chart-line cpu-line" id="cpu-line" points=""></polyline>
                <polyline class="chart-line gpu-line" id="gpu-line" points=""></polyline>
              </svg>
              <div class="chart-legend" aria-hidden="true">
                <span><i class="legend-dot cpu-dot"></i>CPU <strong id="cpu-current"></strong></span>
                <span><i class="legend-dot gpu-dot"></i>GPU <strong id="gpu-current"></strong></span>
              </div>
            </section>

            <section class="stats-card" aria-labelledby="stats-heading">
              <div class="section-heading">
                <h2 id="stats-heading">Device stats</h2>
              </div>
              <dl class="stats-list">
                <div class="stat-row">
                  <dt>Wi-Fi</dt>
                  <dd id="wifi-value"></dd>
                </div>
                <div class="stat-row">
                  <dt>IP address</dt>
                  <dd id="ip-value"></dd>
                </div>
                <div class="stat-row">
                  <dt>CPU utilisation</dt>
                  <dd id="cpu-value"></dd>
                </div>
                <div class="stat-row">
                  <dt>GPU utilisation</dt>
                  <dd id="gpu-value"></dd>
                </div>
                <div class="stat-row">
                  <dt>Uptime</dt>
                  <dd id="uptime-value"></dd>
                </div>
                <div class="stat-row">
                  <dt>Memory free</dt>
                  <dd id="memory-value"></dd>
                </div>
                <div class="stat-row">
                  <dt>Temperature</dt>
                  <dd id="temperature-value"></dd>
                </div>
                <div class="stat-row">
                  <dt>Firmware</dt>
                  <dd id="firmware-value"></dd>
                </div>
              </dl>
            </section>
          </div>

          <footer class="screen-actions">
            <button class="primary-action" id="wifi-action" type="button">
              <span>Connect to Wi-Fi</span>
              <span class="action-arrow" aria-hidden="true">↗</span>
            </button>
          </footer>

          <section
            class="wifi-sheet"
            id="wifi-sheet"
            aria-labelledby="wifi-sheet-title"
            aria-hidden="true"
            hidden
          >
            <div class="sheet-header">
              <div>
                <p class="sheet-kicker">NETWORK SETUP</p>
                <h2 id="wifi-sheet-title">Connect to Wi-Fi</h2>
              </div>
              <button class="icon-button" id="wifi-close" type="button" aria-label="Close Wi-Fi setup">×</button>
            </div>

            <div id="network-step" class="sheet-step">
              <p class="sheet-copy">Choose a nearby network for NOVA.</p>
              <div class="network-list" id="network-list"></div>
            </div>

            <form id="password-step" class="sheet-step" hidden>
              <button class="back-button" id="wifi-back" type="button">← Networks</button>
              <p class="sheet-copy">Enter the password for <strong id="selected-network">your network</strong>.</p>
              <label class="password-label" for="wifi-password">Password</label>
              <input id="wifi-password" type="password" autocomplete="current-password" required />
              <button class="connect-button" type="submit">Connect</button>
            </form>
          </section>
        </div>
      </section>
    </main>

    <script src="fixtures.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
