name: nova-sentinel

services:
  sentinel-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      NOVA_PROC_ROOT: /host/proc
      NOVA_DISK_ROOT: /host/disk
    expose:
      - "8000"
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: ${NOVA_DISK_PATH:-/}
        target: /host/disk
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      sentinel-api:
        condition: service_healthy
    environment:
      NOVA_PUBLIC_HOST: ${NOVA_PUBLIC_HOST:?set NOVA_PUBLIC_HOST in backend/.env}
    ports:
      - "${NOVA_LAN_ADDRESS:?set NOVA_LAN_ADDRESS in backend/.env}:${NOVA_LAN_PORT:-443}:443"
    volumes:
      - type: bind
        source: ./deploy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      # The official image marks the Caddy binary with this file capability.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
