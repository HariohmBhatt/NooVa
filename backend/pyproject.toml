[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-sentinel-backend"
version = "0.1.0"
description = "Read-only health policy service for NOVA Sentinel"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "mypy==1.20.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
