[platformio]
default_envs = waveshare-esp32-s3-touch-lcd-35
src_dir = firmware

[env:waveshare-esp32-s3-touch-lcd-35]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug
build_unflags = -std=gnu++11

; The Waveshare board uses 16 MB flash and 8 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; The board's USB connection is used for the Arduino serial console.
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
upload_speed = 460800
debug_tool = esp-builtin
