; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare-esp32-s3-touch-lcd-35
src_dir = .

[env:waveshare-esp32-s3-touch-lcd-35]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug
build_unflags = -std=gnu++11
build_src_filter =
    +<firmware/main.cpp>
    +<firmware/core/Logger.cpp>
    +<firmware/hardware/BoardDisplay.cpp>
    +<firmware/hardware/BoardTouch.cpp>
    +<firmware/network/WifiService.cpp>
    +<firmware/ui/UiController.cpp>
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
	-std=gnu++17
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=3
	-DLV_CONF_INCLUDE_SIMPLE
	-Ifirmware
lib_deps =
	moononournation/GFX Library for Arduino @ 1.5.5
	robtillaart/TCA9554 @ 0.1.2
	lewisxhe/SensorLib @ 0.3.1
	lvgl/lvgl @ 8.4.0
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	time
upload_speed = 460800
debug_tool = esp-builtin

