[platformio]
default_envs = waveshare-esp32-s3-touch-lcd-35
src_dir = src

[common]
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson @ 6.21.5

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_flags =
    ${common.build_flags}
    -DNOVA_HOST_TEST
    -Wall
    -Wextra
    -Wpedantic
    -Werror
build_src_filter =
    +<status/*.cpp>
    +<network/StatusCodec.cpp>
lib_deps =
    ${common.lib_deps}

[env:waveshare-esp32-s3-touch-lcd-35]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
build_type = release
build_unflags = ${common.build_unflags}
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ${sysenv.NOVA_PROVISIONING_BUILD_FLAGS}
lib_deps =
    ${common.lib_deps}
    moononournation/GFX Library for Arduino @ 1.5.5
    robtillaart/TCA9554 @ 0.1.2
    lewisxhe/SensorLib @ 0.3.1
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
upload_port = /dev/ttyACM0
upload_speed = 460800
