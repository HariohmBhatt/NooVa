[env:touch-test]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug
build_unflags = -std=gnu++11
build_src_filter = +<hardware/testing/touch/touch_test.cpp>

; The Waveshare board uses 16 MB flash and 8 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; The board's USB connection is used for the Arduino serial console.
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    moononournation/GFX Library for Arduino @ 1.5.5
    robtillaart/TCA9554 @ 0.1.2
    lewisxhe/SensorLib @ 0.3.1
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
upload_speed = 460800
debug_tool = esp-builtin

[env:wifi-test]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug
build_unflags = -std=gnu++11
build_src_filter = +<hardware/testing/wifi/wifi_test.cpp>

; The Waveshare board uses 16 MB flash and 8 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Inject hexadecimal -DWIFI_TEST_SSID_HEX and -DWIFI_TEST_PASSWORD_HEX tokens.
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ${sysenv.WIFI_TEST_BUILD_FLAGS}
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
upload_speed = 460800
debug_tool = esp-builtin

